name: Release

on:
  workflow_dispatch:
    inputs:
      version_release:
        description: "Version of the release"
        required: true

permissions:
    contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew buildAndCollect

      - name: List release artifacts
        run: |
          ls -lhR build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ inputs.version_release || github.ref }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Release v${{ inputs.version_release || github.ref }}"
          body: "Automatic release of version ${{ inputs.version_release || github.ref }}"
          draft: true
          prerelease: false
          files: |
            build/libs/**/*.jar
            LICENSE.md
          fail_on_unmatched_files: true
